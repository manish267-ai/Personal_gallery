name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  tags:
    - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up JDK environment (Java 17 is standard for modern Android projects)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Grant execution permissions to Gradle wrapper script
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Setup Gradle caching to speed up consecutive builds
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 5. Run lint & unit tests (if any)
      - name: Run Lint & Tests
        run: ./gradlew test

      # 6. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. Upload the built APK as a downloadable workflow artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
